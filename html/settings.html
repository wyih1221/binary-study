<script>
(function(){
  var MODE_KEY='wenguo-theme-mode', TK='wenguo-theme';
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function cur(){try{return localStorage.getItem(MODE_KEY)||'light'}catch(e){return 'light'}}
  function paint(m){
    var cards=document.querySelectorAll('.bh-theme-card');
    for(var i=0;i<cards.length;i++){cards[i].setAttribute('aria-pressed', cards[i].getAttribute('data-mode')===m?'true':'false');}
    var now=document.getElementById('bhThemeNow');
    if(now) now.textContent='当前：'+(m==='system'?'跟随系统':(m==='dark'?'夜间':'日间'));
  }
  function apply(m){
    var dark = m==='dark' || (m==='system' && mq.matches);
    document.documentElement.classList.toggle('dark', dark);
    try{localStorage.setItem(MODE_KEY,m);localStorage.setItem(TK, dark?'dark':'light');}catch(e){}
    if(typeof syncFavicon==='function'){try{syncFavicon()}catch(e){}}
    paint(m);
  }
  var cards=document.querySelectorAll('.bh-theme-card');
  for(var i=0;i<cards.length;i++){
    cards[i].addEventListener('click', function(){ apply(this.getAttribute('data-mode')); });
  }
  if(mq.addEventListener){ mq.addEventListener('change', function(){ if(cur()==='system') apply('system'); }); }
  apply(cur());
})();
</script>
