<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 二进制书房</title>
    <link rel="icon" type="image/png" href="../images/icon.png">
    <link rel="stylesheet" href="../css/fredoka.css">
    <link rel="stylesheet" href="../css/site-base.css">
    <script>
        (function(){try{var m=localStorage.getItem("wenguo-theme-mode"),d;if(m==="dark")d=true;else if(m==="light")d=false;else if(m==="system")d=window.matchMedia("(prefers-color-scheme: dark)").matches;else d=localStorage.getItem("wenguo-theme")==="dark";if(d)document.documentElement.classList.add("dark");}catch(e){}})();
    </script>
</head>

<body class="font-sans antialiased">
    <main class="bh-auth v3-theme">
        <div class="bh-auth-card">
            <div class="bh-auth-brand"><span class="v41-brand-logo" aria-hidden="true"></span>
                <span>二进制书房</span>
            </div>
            <h1 class="bh-auth-title">注册</h1>
            <p class="bh-auth-sub">30 秒创建账号，开始刷题</p>

            <div class="bh-field"><label>用户名</label>
                <input class="bh-input" id="authId" placeholder="2–16 个字符" autocomplete="username">
            </div>
            <div class="bh-field"><label>邮箱</label><input class="bh-input" id="authMail" placeholder="you@example.com"></div>
            <div class="bh-field"><label>密码</label>
                <input class="bh-input" id="authPwd" type="password" placeholder="至少 6 位" autocomplete="current-password">
            </div>
            <div class="bh-field"><label>确认密码</label><input class="bh-input" id="authPwd2" type="password" placeholder="再输一次"></div>
            <p class="bh-auth-err" id="authErr" hidden></p>
            <button class="bh-btn bh-btn-grape bh-btn-block" id="authSubmit" type="button">创建账号</button>
            <div class="bh-auth-foot"><a href="login.html">已有账号？去登录</a></div>
        </div>
        <button class="bh-auth-theme" type="button" aria-label="切换主题">跟随系统切换明暗</button>
    </main>
    <script src="../js/core.js"></script>
    <script src="../js/features.js"></script>
</body>

</html>
