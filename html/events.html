<html lang="zh-CN" style="">

<head>
    <script>(function () { try { var t = localStorage.getItem("wenguo-theme"); if (t === "dark") document.documentElement.classList.add("dark"); } catch (e) { } })();</script>
    <link rel="stylesheet" href="../css/site-base.css">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161629">
    <meta name="theme-color" content="#050807">
    <link rel="stylesheet" href="../css/fredoka.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>二进制书房 - 智能刷题平台</title>
    <meta name="description" content="真题练习、错题复习，稳稳通过考试">
    <link rel="shortcut icon" href="../images/icon.png">
    <link rel="icon" href="../images/icon.png">
    <link rel="apple-touch-icon" href="../images/icon-180.png">
</head>

<body class="font-sans antialiased">
    <div class="v41-auth min-h-screen flex items-center justify-center relative overflow-hidden">
        <div class="v41-grid-dots absolute inset-0 pointer-events-none"></div><a
            class="absolute left-6 top-6 z-10 flex items-center gap-1.5 text-[13px] font-semibold transition-colors"
            href="index.html" style="color: var(--v41-muted);"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left size-[14px]"
                aria-hidden="true">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
            </svg>返回主站</a>
        <div class="relative z-10 w-full max-w-[420px] mx-auto px-6" style="opacity: 1; transform: none;">
            <div class="flex flex-col items-center mb-8" style="opacity: 1; transform: none;">
                <div class="size-[64px] rounded-2xl flex items-center justify-center mb-4 relative"
                    style="background: var(--v41-primary); border: 3px solid var(--v41-ink); box-shadow: 4px 4px 0 var(--v41-ink);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-shield-check size-[32px] text-white" aria-hidden="true">
                        <path
                            d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z">
                        </path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <div class="absolute -top-1 -right-1 size-[14px] rounded-full"
                        style="background: var(--v41-accent); border: 2px solid var(--v41-ink);"></div>
                </div>
                <h1 class="text-[28px] font-bold tracking-tight leading-[1.2]" >管理控制台</h1>
                <p class="mt-1.5 text-[13px] font-medium" style="color: var(--v41-muted);">Management Console · 仅限授权管理员
                </p>
            </div>
            <div class="rounded-2xl p-7"
                style="background: var(--v41-card); border: 3px solid var(--v41-ink); box-shadow: 6px 6px 0 var(--v41-ink);">
                <form novalidate="" class="flex flex-col gap-[18px]">
                    <div style="opacity: 1; transform: none;"><label for="admin-email" class="v41-label">管理员邮箱</label>
                        <div class="relative"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-mail absolute left-[14px] top-1/2 -translate-y-1/2 size-[18px] pointer-events-none"
                                aria-hidden="true" style="color: var(--v41-muted);">
                                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            </svg><input id="admin-email" placeholder="请输入管理员邮箱" autocomplete="email"
                                class="v41-input pl-[42px]" type="email" name="email"></div>
                    </div>
                    <div style="opacity: 1; transform: none;"><label for="admin-password" class="v41-label">密码</label>
                        <div class="relative"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"
                                class="lucide lucide-lock absolute left-[14px] top-1/2 -translate-y-1/2 size-[18px] pointer-events-none"
                                aria-hidden="true" style="color: var(--v41-muted);">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg><input id="admin-password" placeholder="请输入密码" autocomplete="current-password"
                                class="v41-input pl-[42px] pr-[44px]" type="password" name="password"><button
                                type="button"
                                class="absolute right-[12px] top-1/2 -translate-y-1/2 p-1 rounded transition-colors"
                                aria-label="显示密码" style="color: var(--v41-muted);"><svg
                                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-eye size-[18px]" aria-hidden="true">
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
                                    </path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg></button></div>
                    </div>
                    <div style="opacity: 1; transform: none;"><button type="submit"
                            class="v41-btn-primary w-full flex items-center justify-center gap-2 mt-2"><svg
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-shield-check size-[16px]"
                                aria-hidden="true">
                                <path
                                    d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z">
                                </path>
                                <path d="m9 12 2 2 4-4"></path>
                            </svg>管理员登录</button></div>
                </form>
                <div class="mt-5 p-3 rounded-xl flex items-start gap-2"
                    style="background: var(--v41-primary-bg); border: 2px solid var(--v41-border); opacity: 1;"><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-triangle-alert size-[16px] mt-0.5 shrink-0" aria-hidden="true"
                        style="color: var(--v41-warning);">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path>
                        <path d="M12 9v4"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                    <p class="text-[12px] leading-relaxed font-medium" style="color: var(--v41-ink-soft);">
                        本操作将被记录审计，请确认你拥有管理权限。未授权访问将被拒绝。</p>
                </div>
            </div>
            <p class="text-center mt-6 text-[12px] font-medium" style="color: var(--v41-muted); opacity: 1;">© 二进制书房 ·
                管理控制台 · 2026</p>
        </div>
    </div>
    <script src="../js/app.js"></script>
</body>

</html>
