                <div class="flex items-center gap-3 ml-auto">
                    <div class="text-[15px]" style="color:var(--v41-muted)">想起密码了？<a

                            </path>
                        </svg></button>

                        <div class="mb-6">
                            <h1 class="text-[28px] font-bold tracking-tight leading-[1.2]"
                                style="opacity: 1; transform: none">忘记密码</h1>
                            <p class="mt-2 text-[13px]" style="color: var(--v41-muted); opacity: 1;">验证邮箱后即可设置新密码，无需原密码
                            </p>
                        </div>
                        <form novalidate="" class="flex flex-col gap-[18px]">
                            <div style="opacity: 1; transform: none;"><label for="f-email"
                                    class="v41-label">邮箱地址</label>
                                <div class="relative"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round"
                                        class="lucide lucide-mail absolute left-[14px] top-1/2 -translate-y-1/2 size-[18px] pointer-events-none"
                                        aria-hidden="true" style="color:var(--v41-muted)">
                                        <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
                                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                    </svg><input id="f-email" type="email" placeholder="请输入注册时使用的邮箱"
                                        autocomplete="email" class="v41-input pl-[42px]" value=""></div>
                            </div>
                            <div style="opacity: 1; transform: none;"><label for="f-code"
                                    class="v41-label">邮箱验证码</label>
                                <div class="flex gap-2">
                                    <div class="relative flex-1"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                            class="lucide lucide-key-round absolute left-[14px] top-1/2 -translate-y-1/2 size-[18px] pointer-events-none"
                                            aria-hidden="true" style="color:var(--v41-muted)">
                                            <path
                                                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z">
                                            </path>
                                            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
                                        </svg><input id="f-code" type="text" inputmode="numeric"
                                            placeholder="请输入 6 位验证码" autocomplete="one-time-code" maxlength="8"
                                            class="v41-input pl-[42px]" value=""></div><button type="button" disabled=""
                                        class="v41-btn-ghost shrink-0" style="min-width:110px">获取验证码</button>
                                </div>
                            </div>
                            <div style="opacity: 1; transform: none;"><label for="f-password"
                                    class="v41-label">新密码</label>
                                <div class="relative"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round"
                                        class="lucide lucide-lock absolute left-[14px] top-1/2 -translate-y-1/2 size-[18px] pointer-events-none"
                                        aria-hidden="true" style="color:var(--v41-muted)">
                                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg><input id="f-password" type="password" placeholder="至少 8 位，含大小写/数字/符号"
                                        autocomplete="new-password" class="v41-input pl-[42px] pr-[44px]"
                                        value=""><button type="button"
                                        class="absolute right-[12px] top-1/2 -translate-y-1/2 size-8 flex items-center justify-center rounded-lg transition-colors"
                                        style="color:var(--v41-muted)" tabindex="-1" aria-label="显示密码"><svg
                                            xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round"
                                            class="lucide lucide-eye size-[18px]" aria-hidden="true">
                                            <path
                                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
                                            </path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg></button></div>
                                <p class="text-[11px] mt-1.5 leading-relaxed" style="color:var(--v41-muted)">需
                                    <!-- -->8<!-- --> 位以上，且包含大写字母、小写字母、数字、符号中的 3 类
                                </p>
                            </div>
                            <div style="opacity: 1; transform: none;"><label for="f-confirm"

                                <div class="relative"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"

                                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg><input id="f-confirm" type="password" placeholder="再次输入新密码"
                                        autocomplete="new-password" class="v41-input pl-[42px]" value=""></div>
                            </div>
                            <div class="pt-2" style="opacity: 1; transform: none;"><button type="submit"

                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" class="lucide lucide-chevron-right size-[18px]"
                                        aria-hidden="true">
                                        <path d="m9 18 6-6-6-6"></path>
                                    </svg></button>
                                <p class="mt-2.5 text-center text-[11px]" style="color:var(--v41-muted)">重置成功后请使用新密码重新登录
                                </p>
                            </div>
                        </form>
                        <div class="mt-5 text-center" style="opacity: 1;"><a
                                class="inline-flex items-center gap-1 text-[13px] font-bold hover:underline"

                                    <path d="m15 18-6-6 6-6"></path>
                                </svg>返回登录</a></div>
                    </div>
